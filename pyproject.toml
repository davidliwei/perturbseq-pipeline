[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perturbseq-pipeline"
version = "0.1.0"
description = "A simple, reproducible Perturb-seq QC, clustering and perturbation-strength pipeline"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Wei Li Lab" }]
keywords = ["perturb-seq", "crispr", "single-cell", "scanpy"]

dependencies = [
    "scanpy>=1.10",
    "anndata>=0.10",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "leidenalg>=0.10",
    "igraph>=0.11",
    "statsmodels>=0.14",
    "gseapy>=1.1",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "threadpoolctl>=3.0",
    "psutil>=5.9",
    # Basic QC stage: native 10x .h5 loading, xlsx guide-design workbooks,
    # and Scrublet's automatic threshold (scanpy's implementation needs skimage).
    "h5py>=3.8",
    "openpyxl>=3.1",
    "scikit-image>=0.20",
]

[project.optional-dependencies]
harmony = ["harmonypy>=0.0.9"]
demo = ["gdown>=5.1"]
# Network graphs for the co-functional module / gene program stage (Fig 1f/g style).
# The heatmaps and alluvial are drawn without it; only the graph layouts need networkx.
networks = ["networkx>=3.0"]
# Per-cell perturbation scores, from the lab's PS_python repository.
ps = [
    "pertps @ git+https://github.com/weili-lab/PS_python.git#subdirectory=pertps_project",
    "scikit-learn>=1.3",
    "umap-learn>=0.5",
]
gpu = [
    "cupy-cuda12x>=12.0",
    "cuml-cu12",
    "rapids-singlecell>=0.9.0",
]
dev = ["pytest>=7.0"]

[project.scripts]
perturbseq-pipeline = "perturbseq_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
perturbseq_pipeline = ["templates/*.html", "templates/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["cache", "scratch", "results", ".git", ".pytest_cache"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.format]
# Ignore trailing commas when deciding whether to split a call or literal over lines.
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
split-on-trailing-comma = false
